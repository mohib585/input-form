<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registration Form</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: "Segoe UI", Tahoma, Geneva, Verdana, sans-serif;
    }

    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .form-container {
      background: #ffffff;
      padding: 30px 40px;
      border-radius: 12px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      width: 100%;
      max-width: 450px;
    }

    .form-container h2 {
      margin-bottom: 25px;
      color: #333333;
      text-align: center;
      font-size: 24px;
    }

    .input-group {
      margin-bottom: 20px;
    }

    .input-group label {
      display: block;
      margin-bottom: 8px;
      color: #555555;
      font-weight: 600;
      font-size: 14px;
    }

    .input-group input,
    .input-group select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 6px;
      font-size: 15px;
      outline: none;
      transition: border-color 0.3s;
    }

    .input-group input:focus,
    .input-group select:focus {
      border-color: #667eea;
    }

    .phone-wrapper {
      display: flex;
      align-items: center;
      border: 1px solid #ccc;
      border-radius: 6px;
      overflow: hidden;
      background: #fff;
      transition: border-color 0.3s;
    }

    .phone-wrapper:focus-within {
      border-color: #667eea;
    }

    .flag-code-container {
      display: flex;
      align-items: center;
      padding: 0 10px;
      background: #f8f9fa;
      border-right: 1px solid #ccc;
      height: 45px;
      gap: 6px;
      flex-shrink: 0;
    }

    .flag-code-container img {
      width: 24px;
      height: 16px;
      object-fit: cover;
      border-radius: 2px;
    }

    #dialCode {
      font-size: 14px;
      color: #333;
      font-weight: 500;
      white-space: nowrap;
    }

    .phone-wrapper input {
      flex: 1;
      border: none;
      border-radius: 0;
      padding: 12px;
      outline: none;
    }

    .submit-btn {
      width: 100%;
      background: #667eea;
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background 0.3s;
    }

    .submit-btn:hover {
      background: #5563c1;
    }

    #successMessage {
      margin-top: 15px;
      text-align: center;
      color: #28a745;
      font-weight: 600;
      font-size: 14px;
      min-height: 20px;
    }
  </style>
</head>
<body>
  <div class="form-container">
    <h2>Register Form</h2>
    <form id="registrationForm">
      <div class="input-group">
        <label for="fullName">Full Name:</label>
        <input type="text" id="fullName" name="fullName" placeholder="Enter your full name" required />
      </div>

      <div class="input-group">
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Enter your email address" required />
      </div>

      <div class="input-group">
        <label for="countrySelect">Country:</label>
        <select id="countrySelect" name="country" required>
          <option value="" selected disabled>Select your country</option>
        </select>
      </div>

      <div class="input-group">
        <label for="mobileNumber">Mobile Number:</label>
        <div class="phone-wrapper">
          <div class="flag-code-container">
            <img id="countryFlag" src="https://flagcdn.com/w40/un.png" alt="Flag" />
            <span id="dialCode">+00</span>
          </div>
          <input type="tel" id="mobileNumber" name="mobileNumber" placeholder="Mobile number" required />
        </div>
      </div>

      <button type="submit" class="submit-btn">Submit</button>
      <div id="successMessage"></div>
    </form>
  </div>

  <script>
    const countrySelect = document.getElementById("countrySelect");
    const countryFlag = document.getElementById("countryFlag");
    const dialCodeSpan = document.getElementById("dialCode");
    const registrationForm = document.getElementById("registrationForm");
    const successMessage = document.getElementById("successMessage");

    const DEFAULT_FLAG = "https://flagcdn.com/w40/un.png";
    const DEFAULT_DIAL_CODE = "+00";

    function setCountryMeta(option) {
      const flagUrl = option?.dataset?.flag || DEFAULT_FLAG;
      const dialCode = option?.dataset?.code || DEFAULT_DIAL_CODE;

      countryFlag.src = flagUrl;
      dialCodeSpan.textContent = dialCode;
    }

    function extractDialCode(country) {
      if (!country || !country.idd || !country.idd.root) return "";

      const root = country.idd.root || "";
      const suffixes = Array.isArray(country.idd.suffixes)
        ? country.idd.suffixes.filter(Boolean)
        : [];

      if (!suffixes.length) return root;

      // Some countries have multiple suffixes. Use the first valid one.
      return root + suffixes[0];
    }

    async function fetchCountries() {
      try {
        const response = await fetch("https://restcountries.com/v3.1/all?fields=name,cca2,idd,flags");
        const countries = await response.json();

        countries
          .filter(country => country?.name?.common && country?.flags?.svg)
          .sort((a, b) => a.name.common.localeCompare(b.name.common))
          .forEach(country => {
            const countryName = country.name.common;
            const countryCode = (country.cca2 || "un").toLowerCase();
            const dialCode = extractDialCode(country);

            const option = document.createElement("option");
            option.value = countryName;
            option.dataset.flag = country.flags.svg || `https://flagcdn.com/w40/${countryCode}.png`;
            option.dataset.code = dialCode || "";
            option.textContent = countryName;

            countrySelect.appendChild(option);
          });

        setCountryMeta(countrySelect.options[0]);
      } catch (error) {
        console.error("Error fetching countries:", error);
      }
    }

    countrySelect.addEventListener("change", (e) => {
      const selectedOption = e.target.options[e.target.selectedIndex];
      setCountryMeta(selectedOption);
    });

    registrationForm.addEventListener("submit", (e) => {
      e.preventDefault();

      const fullName = document.getElementById("fullName").value.trim();
      const country = countrySelect.value;
      const mobileNumber = document.getElementById("mobileNumber").value.trim();

      if (!fullName || !country || !mobileNumber) {
        successMessage.textContent = "Please fill in all required fields.";
        successMessage.style.color = "#d32f2f";
        return;
      }

      successMessage.style.color = "#28a745";
      successMessage.textContent = `Thank you, ${fullName}! Form submitted successfully.`;

      registrationForm.reset();
      countrySelect.selectedIndex = 0;
      setCountryMeta(countrySelect.options[0]);
    });

    fetchCountries();
  </script>
</body>
</html>
